services:
  - type: web
    name: isdp-backend
    runtime: node
    repo: https://github.com/pius-kamau/isdp-platform
    branch: master
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: isdp-database
          property: connectionString
      - key: UPSTASH_REDIS_REST_URL
        value: "https://pure-beagle-187577.upstash.io"
      - key: UPSTASH_REDIS_REST_TOKEN
        value: "gQAAAAAAAty5AAIgcDI2ZWVkOWI3NjMwZjc0NjRlYjU3YjdkOWYyMmVhYTJmOA"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_REFRESH_EXPIRE
        value: 30d
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: pitechtechnologies@gmail.com
      - key: BREVO_SENDER_NAME
        value: ISDP Platform
      - key: CLIENT_URL
        value: https://your-frontend-url.onrender.com

databases:
  - name: isdp-database
    plan: free