services:
  - type: web
    name: isdp-backend
    runtime: node
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: isdp-database
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: isdp-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: pitechtechnologies@gmail.com
      - key: BREVO_SENDER_NAME
        value: ISDP Platform
      - key: CLIENT_URL
        value: https://your-frontend-url.onrender.com

databases:
  - name: isdp-database
    plan: free

  - name: isdp-redis
    plan: free